<svg width="512" height="512" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dhwoniGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#d4af37" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="dhwoniGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbf0b9" />
      <stop offset="35%" stopColor="#dfb743" />
      <stop offset="70%" stopColor="#c49b2c" />
      <stop offset="100%" stopColor="#e5c158" />
    </linearGradient>
    <path id="topTextCurve" d="M 85 250 A 165 165 0 0 1 415 250" fill="none" />
    <path id="bottomTextCurve" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
  </defs>

  <rect width="500" height="500" rx="100" fill="#070707" />
  <circle cx="250" cy="250" r="230" fill="url(#dhwoniGoldGlow)" />
  <circle cx="250" cy="250" r="220" stroke="url(#dhwoniGoldGrad)" stroke-width="7" fill="none" />
  <circle cx="250" cy="250" r="206" stroke="url(#dhwoniGoldGrad)" stroke-width="2" fill="none" />

  <text fill="url(#dhwoniGoldGrad)" font-size="29" font-family="'Cinzel', serif" font-weight="700" letter-spacing="4">
    <textPath href="#topTextCurve" startOffset="50%" text-anchor="middle">
      • DHWONI STUDIO •
    </textPath>
  </text>

  <text fill="url(#dhwoniGoldGrad)" font-size="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" letter-spacing="2.5" opacity="0.85">
    <textPath href="#bottomTextCurve" startOffset="50%" text-anchor="middle">
      GOLAGHAT • UPPER TEMERA GAON • ASSAM
    </textPath>
  </text>

  <!-- Condenser Microphone -->
  <g transform="translate(160, 165)">
    <rect x="-24" y="0" width="48" height="72" rx="24" stroke="url(#dhwoniGoldGrad)" stroke-width="4" fill="#0d0d0d" />
    <line x1="-16" y1="18" x2="16" y2="18" stroke="url(#dhwoniGoldGrad)" stroke-width="1.5" opacity="0.7" />
    <line x1="-20" y1="32" x2="20" y2="32" stroke="url(#dhwoniGoldGrad)" stroke-width="1.5" opacity="0.7" />
    <line x1="-20" y1="46" x2="20" y2="46" stroke="url(#dhwoniGoldGrad)" stroke-width="1.5" opacity="0.7" />
    <line x1="0" y1="10" x2="0" y2="64" stroke="url(#dhwoniGoldGrad)" stroke-width="1.5" opacity="0.7" />
    <path d="M -34 42 C -34 84, 34 84, 34 42" stroke="url(#dhwoniGoldGrad)" stroke-width="4" fill="none" stroke-linecap="round" />
    <line x1="0" y1="84" x2="0" y2="104" stroke="url(#dhwoniGoldGrad)" stroke-width="4.5" />
    <line x1="-22" y1="104" x2="22" y2="104" stroke="url(#dhwoniGoldGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Studio Headphones -->
  <g transform="translate(295, 175)">
    <path d="M -54 50 C -54 -20, 54 -20, 54 50" stroke="url(#dhwoniGoldGrad)" stroke-width="5" fill="none" stroke-linecap="round" />
    <g transform="translate(-54, 52)">
      <rect x="-10" y="-4" width="16" height="42" rx="8" stroke="url(#dhwoniGoldGrad)" stroke-width="3.5" fill="#0e0e0e" />
    </g>
    <g transform="translate(54, 52)">
      <rect x="-6" y="-4" width="16" height="42" rx="8" stroke="url(#dhwoniGoldGrad)" stroke-width="3.5" fill="#0e0e0e" />
    </g>
  </g>

  <!-- Waveform -->
  <path d="M 120 290 L 180 290 Q 202 278 216 295 Q 228 260 240 338 Q 252 245 264 340 Q 276 270 288 320 Q 300 282 312 290 L 380 290" stroke="url(#dhwoniGoldGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Assamese Text: ধ্বনি -->
  <text x="250" y="350" text-anchor="middle" fill="url(#dhwoniGoldGrad)" font-size="34" font-weight="700" font-family="'Hind Siliguri', sans-serif">
    ধ্বনি
  </text>
</svg>
